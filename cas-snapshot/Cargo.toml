[package]
name = "cas-snapshot"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "cas-snapshot"
path = "src/main.rs"

[dependencies]
rusqlite = { version = "0.40", features = ["bundled"] }
sha2 = "0.10"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny_http = "0.12"

[profile.release]
opt-level = 2
